           C 95,165 135,165 162,172 
           C 170,185 162,214 142,229 
           C 122,243 95,237 84,218 
           C 76,202 77,184 84,174 Z" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="1.8" />

