    <path d="M 282,62 C 310,94 322,138 316,198" stroke="#6d7582" stroke-width="1.5" opacity="0.65" />
    <path d="M 296,64 C 322,98 330,144 322,206" stroke="#8d96a6" stroke-width="1.1" opacity="0.55" />
    <path d="M 310,78 C 330,112 336,154 326,214" stroke="#5c6370" stroke-width="1.3" opacity="0.6" />

    <path d="M 96,96 C 84,128 80,166 80,208" stroke="#6d7582" stroke-width="1.5" opacity="0.7" />
    <path d="M 88,108 C 76,140 74,178 76,218" stroke="#8d96a6" stroke-width="1.1" opacity="0.6" />
    <path d="M 102,112 C 90,142 86,176 85,212" stroke="#5c6370" stroke-width="1.3" opacity="0.65" />
  </g>

  <!-- もみあげ -->
  <path d="M 283,218 C 291,234 291,256 282,274 C 279,262 280,240 283,218 Z" fill="#18191c" />
  <path d="M 286,224 C 292,240 291,258 285,272" fill="none" stroke="#4a5059" stroke-width="1" stroke-linecap="round" />
  <path d="M 81,208 C 77,226 79,244 85,256 C 86,240 85,222 81,208 Z" fill="#18191c" />
  <path d="M 79,214 C 77,230 79,244 83,254" fill="none" stroke="#4a5059" stroke-width="1" stroke-linecap="round" />

  <!-- シャープでスッと通った鼻と人中 -->
  <path d="M 173,174 C 172,196 170,218 169,236" fill="none" stroke="#fff0e6" stroke-width="3.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 178,176 C 179,196 181,215 184,230" fill="none" stroke="#c9845d" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  <path d="M 157,232 C 151,236 152,243 160,244 C 165,245 169,246 173,246 C 177,246 181,245 186,244 C 193,243 194,235 187,230" fill="none" stroke="#b56e48" stroke-width="2.1" stroke-linecap="round" />
  <path d="M 159,240 C 162,238 166,239 168,242 C 165,243 161,243 159,240 Z" fill="#633219" />
  <path d="M 177,242 C 180,239 184,238 186,240 C 184,243 180,243 177,242 Z" fill="#633219" />
  <path d="M 167,252 C 167,259 166,265 165,270 M 177,252 C 177,259 178,265 179,270" fill="none" stroke="#cf8a63" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

  <!-- 引き締まった口元 -->
  <path d="M 129,277 C 145,274 162,272 172,275 C 182,273 198,276 211,279 C 195,283 182,284 172,282 C 158,283 142,281 129,277 Z" fill="#c97167" />
  <path d="M 127,276 C 148,281 165,282 173,282 C 182,282 199,281 214,278" fill="none" stroke="#853c34" stroke-width="1.9" stroke-linecap="round" />
  <path d="M 135,280 C 152,292 188,293 204,280 C 188,285 152,285 135,280 Z" fill="#de867b" />
  <path d="M 153,286 C 165,289 178,289 187,286" fill="none" stroke="#f7b7af" stroke-width="1.8" stroke-linecap="round" />

  <!-- 顎髭（原画の形状・鼻下なし・黒ベース＋サラサラの繊細な毛束感） -->
  <path d="M 117,286 
           C 115,308 119,328 135,338 
           C 154,347 187,347 205,336 
           C 217,326 221,306 219,288 
           C 213,305 207,318 191,320 
           C 175,322 152,320 137,316 
           C 125,312 121,298 117,286 Z" fill="#232529" opacity="0.88" />
  <path d="M 152,297 C 164,303 180,303 190,297 C 184,307 160,307 152,297 Z" fill="#232529" opacity="0.88" />

  <!-- 顎髭のサラサラとした細い毛流れ・ハイライトストローク -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#0e0f12" stroke-width="1.3" opacity="0.85">
      <path d="M 122,304 C 123,316 126,326 131,333" />
      <path d="M 132,316 C 134,326 137,334 141,339" />
      <path d="M 144,319 C 145,329 147,337 150,342" />
      <path d="M 156,321 C 157,331 158,339 159,344" />
      <path d="M 169,322 C 169,332 169,340 169,345" />
