           C 215,169 255,173 268,184 
           C 278,196 276,220 262,235 
           C 246,251 214,249 198,232 
           C 184,216 182,188 188,174 Z" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="1.8" />

  <!-- 濃いレンズ越しに強い目力で射抜くゴルゴ13風の鋭い眼光・剛毅な眉 -->
  <g opacity="0.48">
    <!-- 左眉（太さと角度を強め、目との距離を詰めて目力を増幅） -->
    <path d="M 92,172 C 113,174 136,177 158,183 C 159,179 159,175 157,173 C 136,168 113,166 91,167 Z" fill="#000000" />
    <!-- 右眉 -->
    <path d="M 191,184 C 214,179 239,177 262,176 C 263,172 262,169 259,169 C 236,170 212,172 191,175 Z" fill="#000000" />

    <!-- 左目（目力を高めた鋭利なアイライン・くっきりした三白眼・鋭い瞳孔ハイライト） -->
    <path d="M 101,187 C 118,185 136,187 152,191" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 102,192 C 118,188 136,189 151,194 C 136,198 118,198 102,192 Z" fill="#edd9c7" />
    <path d="M 99,192 C 118,187 137,189 154,194" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 105,194 C 120,198 135,198 149,195" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" />
    <!-- 漆黒の黒目と鋭い光の粒 -->
