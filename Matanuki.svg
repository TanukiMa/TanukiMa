<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 知的で落ち着いたクールトーンの背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9d6e3" />
      <stop offset="55%" stop-color="#e3eaf2" />
      <stop offset="100%" stop-color="#cfd8e3" />
    </linearGradient>

    <!-- 肌のグラデーション -->
    <linearGradient id="skinGrad" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f7cbb0" />
      <stop offset="60%" stop-color="#e6a985" />
      <stop offset="100%" stop-color="#c98661" />
    </linearGradient>

    <!-- 黒髪のベースグラデーション -->
    <linearGradient id="hairBaseGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#3c4047" />
      <stop offset="45%" stop-color="#1e2024" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>

    <!-- サラサラ毛束用のハイライトグラデーション -->
    <linearGradient id="hairSheenGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#69707d" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#484d57" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1c1e22" stop-opacity="0.1" />
    </linearGradient>

    <!-- フェラーリレッド（Rosso Corsa）のグラデーション -->
    <linearGradient id="ferrariRedMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2424" />
      <stop offset="50%" stop-color="#d40000" />
      <stop offset="100%" stop-color="#8a0000" />
    </linearGradient>

    <linearGradient id="ferrariRedShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b80000" />
      <stop offset="100%" stop-color="#630000" />
    </linearGradient>

    <linearGradient id="ferrariRedHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4747" />
      <stop offset="60%" stop-color="#d40000" />
      <stop offset="100%" stop-color="#9e0000" />
    </linearGradient>

    <!-- 濃く重厚なダークスモークブラウンのレンズグラデーション -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0805" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#29160c" stop-opacity="0.91" />
      <stop offset="100%" stop-color="#54301b" stop-opacity="0.86" />
    </linearGradient>

    <!-- 細身で知的なプラチナ・シルバーフレーム -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f2f5" />
      <stop offset="50%" stop-color="#8e959e" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <path d="M 310,0 C 330,130 300,260 270,400 L 400,400 L 400,0 Z" fill="#9fb0c4" opacity="0.22" />
  <path d="M 0,0 L 140,0 C 90,120 45,250 0,360 Z" fill="#ffffff" opacity="0.28" />

  <!-- 首 -->
  <path d="M 106,295 C 106,330 98,365 88,400 L 282,400 C 272,365 265,330 262,295 Z" fill="#d99771" />
  <path d="M 108,310 C 146,355 214,360 258,305 C 243,355 190,385 112,360 Z" fill="#b87651" opacity="0.6" />

  <!-- フェラーリレッドのウェア・ストール -->
  <path d="M 75,345 C 62,365 50,385 38,400 L 128,400 C 112,375 95,350 95,335 C 88,335 80,340 75,345 Z" fill="url(#ferrariRedMain)" />
  <path d="M 76,348 C 84,365 92,382 100,400" fill="none" stroke="#ff6666" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 278,312 C 296,326 308,356 285,400 L 192,400 C 234,365 260,335 278,312 Z" fill="url(#ferrariRedShadow)" />
  <path d="M 268,318 C 282,335 275,365 240,400 L 212,400 C 246,365 262,340 268,318 Z" fill="url(#ferrariRedHighlight)" />
  <path d="M 266,322 C 276,338 268,366 236,400" fill="none" stroke="#ff7070" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  <path d="M 288,356 C 302,370 312,386 320,400 L 248,400 C 266,385 280,370 288,356 Z" fill="url(#ferrariRedMain)" />
  <path d="M 288,358 C 278,372 265,386 250,400" fill="none" stroke="#ff5c5c" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- 襟足の後ろ髪 -->
  <path d="M 300,268 C 302,282 296,298 284,308 C 288,295 290,282 290,272 Z" fill="#181a1d" />
  <path d="M 294,274 C 295,288 288,302 278,310" fill="none" stroke="#363a42" stroke-width="1.5" stroke-linecap="round" />

  <!-- 耳（向かって右） -->
  <path d="M 292,208 C 315,200 328,222 320,252 C 313,276 297,285 284,276 Z" fill="#e6a682" />
  <path d="M 296,218 C 309,214 315,228 309,248 C 305,262 296,266 290,260" fill="none" stroke="#bd7b57" stroke-width="2.5" stroke-linecap="round" />

  <!-- 知的で引き締まった精悍な顔の輪郭 -->
  <path d="M 85,135 
           C 78,185 81,244 95,286 
           C 109,328 142,356 180,356 
           C 221,356 260,322 280,274 
           C 299,226 306,174 295,125 
           C 281,72 230,52 178,56 
           C 125,60 93,90 85,135 Z" fill="url(#skinGrad)" />

  <!-- 知的で立体的な陰影 -->
  <path d="M 254,196 C 268,226 262,274 231,314 C 212,337 186,348 164,348 C 202,348 246,321 268,274 C 285,239 285,205 254,196 Z" fill="#c78058" opacity="0.5" />
  <path d="M 248,236 C 238,256 226,274 214,288 C 232,278 248,260 256,240 Z" fill="#c78058" opacity="0.28" />
  <path d="M 110,105 C 145,92 215,92 252,110 C 235,135 135,135 110,105 Z" fill="#ffe6d6" opacity="0.45" />

  <!-- 髪の毛ベース -->
  <path d="M 79,228 
           C 73,188 69,142 79,102 
           C 89,65 118,36 156,24 
           C 194,12 242,18 282,42 
           C 318,64 338,104 338,148 
           C 338,186 326,224 308,252 
