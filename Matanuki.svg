    <circle cx="124" cy="192.2" r="1.2" fill="#ffffff" />

    <!-- 右目（目力を高めた鋭利なアイライン・くっきりした三白眼・鋭い瞳孔ハイライト） -->
    <path d="M 197,192 C 214,189 233,189 249,192" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 198,195 C 214,191 233,191 248,196 C 233,200 214,200 198,195 Z" fill="#edd9c7" />
    <path d="M 195,195 C 214,190 233,191 251,196" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 200,197 C 215,200 231,200 245,197" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" />
